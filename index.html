<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Idea Drop</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 60px;
    }

    .btn-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 48px;
    }

    /* Pulsing rings during recording */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(220, 38, 38, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: none;
    }
    .ring-1 { width: 180px; height: 180px; }
    .ring-2 { width: 230px; height: 230px; }
    .ring-3 { width: 280px; height: 280px; }

    @keyframes pulseRing {
      0%   { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 0;   transform: scale(1.1); }
    }

    .recording .ring-1 { animation: pulseRing 1.4s ease-out infinite; }
    .recording .ring-2 { animation: pulseRing 1.4s ease-out 0.35s infinite; }
    .recording .ring-3 { animation: pulseRing 1.4s ease-out 0.7s infinite; }

    #recordBtn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: #1a1a1a;
      box-shadow: 0 0 0 4px #2a2a2a;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      z-index: 1;
    }

    #recordBtn:active { transform: scale(0.95); }

    #recordBtn.recording {
      background: #dc2626;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.3);
    }

    #recordBtn svg {
      width: 40px;
      height: 40px;
      color: #888;
      transition: color 0.2s;
    }

    #recordBtn.recording svg { color: #fff; }

    #btnLabel {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      transition: color 0.2s;
    }

    #recordBtn.recording #btnLabel { color: rgba(255,255,255,0.8); }

    #timer {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #333;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
      min-height: 40px;
    }

    #timer.active { color: #dc2626; }

    #status {
      margin-top: 24px;
      font-size: 14px;
      color: #444;
      text-align: center;
      min-height: 48px;
      padding: 0 32px;
      line-height: 1.5;
      transition: color 0.3s;
    }

    #status.success { color: #22c55e; }
    #status.error   { color: #ef4444; }
    #status.sending { color: #f59e0b; }

  </style>
</head>
<body>

  <div class="logo">Idea Drop</div>

  <div class="btn-wrap" id="btnWrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <button id="recordBtn" aria-label="Record idea">
      <!-- Mic icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
      <span id="btnLabel">Hold</span>
    </button>
  </div>

  <div id="timer">0:00</div>
  <div id="status">Press and hold to capture your idea</div>


  <script>
    const WEBHOOK = 'https://hook.us2.make.com/313naeywl2z2canr35pnr1y4k9gdnhib';

    let mediaRecorder = null;
    let audioChunks  = [];
    let timerInterval = null;
    let secondsElapsed = 0;
    let isRecording = false;
    let stream = null;

    const recordBtn = document.getElementById('recordBtn');
    const btnWrap   = document.getElementById('btnWrap');
    const btnLabel  = document.getElementById('btnLabel');
    const timerEl   = document.getElementById('timer');
    const statusEl  = document.getElementById('status');

    // ── Helpers ────────────────────────────────────────────────────────────────
    function setStatus(msg, type = '') {
      statusEl.className = type;
      statusEl.textContent = msg;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      secondsElapsed = 0;
      timerEl.textContent = '0:00';
      timerEl.classList.add('active');
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerEl.textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerEl.classList.remove('active');
    }

    // ── Recording ──────────────────────────────────────────────────────────────
    async function startRecording() {
      if (isRecording) return;

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus('Microphone access denied — check your browser settings', 'error');
        return;
      }

      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => sendRecording();

      mediaRecorder.start();
      isRecording = true;

      recordBtn.classList.add('recording');
      btnWrap.classList.add('recording');
      btnLabel.textContent = 'Release';
      setStatus('Listening… release when done');
      startTimer();
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      mediaRecorder.stop();
      stream.getTracks().forEach(t => t.stop());
      stopTimer();
      recordBtn.classList.remove('recording');
      btnWrap.classList.remove('recording');
      btnLabel.textContent = 'Hold';
    }

    // ── Send to Make.com ───────────────────────────────────────────────────────
    async function sendRecording() {
      if (audioChunks.length === 0) {
        setStatus('Nothing recorded — try again', 'error');
        return;
      }

      const blob = new Blob(audioChunks, { type: 'audio/webm' });

      if (secondsElapsed < 2) {
        setStatus('Too short — hold the button while you talk', 'error');
        setTimeout(() => setStatus('Press and hold to capture your idea'), 3000);
        return;
      }

      setStatus('Sending your idea to Claude…', 'sending');

      const formData = new FormData();
      formData.append('audio', blob, `idea-${Date.now()}.webm`);
      formData.append('timestamp', new Date().toISOString());

      try {
        const res = await fetch(WEBHOOK, {
          method: 'POST',
          body: formData,
        });

        if (res.ok) {
          setStatus('✓ Idea captured! Claude is on it.', 'success');
          timerEl.textContent = '0:00';
          setTimeout(() => setStatus('Press and hold to capture your idea'), 4000);
        } else {
          throw new Error(`HTTP ${res.status}`);
        }
      } catch (err) {
        setStatus('Send failed — check your webhook URL in settings', 'error');
        setTimeout(() => setStatus('Press and hold to capture your idea'), 5000);
      }
    }

    // ── Button Events ──────────────────────────────────────────────────────────
    // Touch (mobile)
    recordBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      startRecording();
    }, { passive: false });

    recordBtn.addEventListener('touchend', e => {
      e.preventDefault();
      stopRecording();
    }, { passive: false });

    // Mouse (desktop testing)
    recordBtn.addEventListener('mousedown', e => {
      e.preventDefault();
      startRecording();
    });

    recordBtn.addEventListener('mouseup', e => {
      e.preventDefault();
      stopRecording();
    });

    // Safety: release if finger leaves the button
    recordBtn.addEventListener('touchcancel', () => stopRecording());
    document.addEventListener('mouseup', () => { if (isRecording) stopRecording(); });
  </script>
</body>
</html>
